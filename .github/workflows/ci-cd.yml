name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gerencia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "10.0.0"
          edition: "community"
          i-agree-to-the-eula: true

      - name: Run Flyway Migrations
        run: |
          flyway migrate \
            -url=jdbc:postgresql://localhost:5432/gerencia_test \
            -user=postgres \
            -password=postgres \
            -locations=filesystem:db/migrations

      - name: Run Integration Tests
        run: npm test 2>&1 | tee test-results.txt
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gerencia_test
          DB_USER: postgres
          DB_PASS: postgres
          NODE_ENV: test

      - name: Run Biome Lint
        run: npx @biomejs/biome lint src/ || true

      - name: Run Biome Format Check
        run: npx @biomejs/biome format src/ --diagnostic-level=error || true

      - name: Verify Docker Build
        run: docker build -t gerencia-app:test .

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: warn
          overwrite: true

  deploy-homolog:
    name: Deploy to Homologation
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy Homologação
        run: |
          cd ~/projeto
          git pull origin develop
          docker compose -f docker-compose.homolog.yml down --remove-orphans
          docker compose -f docker-compose.homolog.yml up -d --build
          echo "✅ Homologação atualizada — $(date)"

  deploy-prod:
    name: Deploy to Production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment:
      name: production
      url: http://177.44.248.108:3002
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy Produção
        run: |
          cd ~/projeto
          git pull origin main
          docker compose -f docker-compose.prod.yml down --remove-orphans
          docker compose -f docker-compose.prod.yml up -d --build
          echo "✅ Produção atualizada — $(date)"