<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel de controle financeiro - Receitas e Despesas">
  <title>Financeiro | Lançamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-page">
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H11.5v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.65c.09 1.71 1.37 2.66 2.85 2.97V19h1.72v-1.67c1.52-.29 2.72-1.16 2.72-2.74 0-2.2-1.89-2.95-3.63-3.45z" fill="currentColor"/>
        </svg>
        <span>Financeiro</span>
      </div>
      <nav class="top-nav" style="display: flex; gap: 0.75rem; margin-left: 1.5rem;">
        <a href="/dashboard" class="btn btn-primary" style="text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right: 2px;">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" fill="currentColor"/>
          </svg>
          Lançamenta
        </a>
        <a href="/usuarios" class="btn btn-export" style="text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right: 2px;">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
          </svg>
          Usuários
        </a>
        <a href="/pipeline" class="btn btn-export" style="text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right: 2px;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z" fill="currentColor"/>
          </svg>
          Pipeline & Dev
        </a>
      </nav>
    </div>
    <div class="top-bar-right">
      <div class="user-info" id="user-info">
        <div class="user-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
          </svg>
        </div>
        <span id="user-name">Usuário</span>
      </div>
      <button class="btn-icon" id="logout-btn" title="Sair">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content-full">
    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="summary-card card-receitas">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z" fill="currentColor"/>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-label">Total Receitas</span>
          <span class="card-value" id="total-receitas">R$ 0,00</span>
        </div>
      </div>
      <div class="summary-card card-despesas">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z" fill="currentColor"/>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-label">Total Despesas</span>
          <span class="card-value" id="total-despesas">R$ 0,00</span>
        </div>
      </div>
      <div class="summary-card card-saldo">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-label">Saldo</span>
          <span class="card-value" id="total-saldo">R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Lançamentos Table -->
    <div class="table-container">
      <div class="table-header">
        <h3>Lançamentos</h3>
        <div class="table-header-actions">
          <div class="date-filter-group">
            <div class="date-filter-field">
              <label for="filter-data-inicio">De</label>
              <input type="date" id="filter-data-inicio" class="filter-date-input">
            </div>
            <div class="date-filter-field">
              <label for="filter-data-fim">Até</label>
              <input type="date" id="filter-data-fim" class="filter-date-input">
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-limpar-datas" title="Limpar filtro de datas">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <select id="filter-tipo" class="filter-select">
            <option value="">Todos os tipos</option>
            <option value="receita">Receitas</option>
            <option value="despesa">Despesas</option>
          </select>
          <button class="btn btn-export" id="btn-exportar-todos-pdf" title="Exportar todos em PDF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z" fill="currentColor"/>
            </svg>
            Exportar Todos
          </button>
          <button class="btn btn-primary" id="btn-novo-lancamento">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
            </svg>
            Novo Lançamento
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="data-table" id="lancamentos-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Valor</th>
              <th>Tipo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lancamentos-table-body">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Lançamento -->
  <div class="modal-overlay" id="modal-lancamento" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-lancamento-title">Novo Lançamento</h3>
        <button class="modal-close" id="modal-lancamento-close">&times;</button>
      </div>
      <form id="form-lancamento" class="modal-form">
        <input type="hidden" id="lancamento-id">
        <div class="form-group">
          <label for="lancamento-descricao">Descrição</label>
          <input type="text" id="lancamento-descricao" placeholder="Ex: Pagamento de aluguel" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="lancamento-data">Data</label>
            <input type="date" id="lancamento-data" required>
          </div>
          <div class="form-group">
            <label for="lancamento-valor">Valor (R$)</label>
            <input type="number" id="lancamento-valor" step="0.01" min="0.01" placeholder="0,00" required>
          </div>
        </div>
        <div class="form-group">
          <label for="lancamento-tipo">Tipo de Lançamento</label>
          <select id="lancamento-tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-lancamento-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Confirmação -->
  <div class="modal-overlay" id="modal-confirm" style="display:none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>Confirmar Exclusão</h3>
        <button class="modal-close" id="modal-confirm-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Deseja realmente excluir este registro?</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">Excluir</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
