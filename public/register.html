<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de controle financeiro - Cadastro">
  <title>Financeiro | Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .link-container {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
    }
    .link-container a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .link-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-form-wrapper">
      <div class="login-form-content">
        <div class="form-header">
          <div class="login-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H11.5v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.65c.09 1.71 1.37 2.66 2.85 2.97V19h1.72v-1.67c1.52-.29 2.72-1.16 2.72-2.74 0-2.2-1.89-2.95-3.63-3.45z" fill="currentColor"/>
            </svg>
          </div>
          <h2>Criar Conta</h2>
          <p>Preencha os dados para se cadastrar</p>
        </div>
        <form id="registerForm" class="login-form" autocomplete="off">
          <div class="form-group">
            <label for="nome-input">Nome</label>
            <div class="input-wrapper">
              <input type="text" id="nome-input" name="nome" placeholder="Digite seu nome completo" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email-input">Email</label>
            <div class="input-wrapper">
              <input type="email" id="email-input" name="email" placeholder="Digite seu melhor email" required>
            </div>
          </div>
          <div class="form-group">
            <label for="login-input">Login (Username)</label>
            <div class="input-wrapper">
              <input type="text" id="login-input" name="login" placeholder="Escolha um nome de usuário" required>
            </div>
          </div>
          <div class="form-group">
            <label for="senha-input">Senha</label>
            <div class="input-wrapper">
              <input type="password" id="senha-input" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
            </div>
          </div>
          
          <div id="register-error" class="error-message" style="display: none;"></div>
          <div id="register-success" class="error-message" style="display: none; background: var(--color-receita-bg); color: var(--color-receita);"></div>
          
          <button type="submit" id="register-btn" class="btn btn-primary btn-full">
            <span class="btn-text">Cadastrar</span>
            <span class="btn-loader" style="display: none;">
              <span class="spinner"></span>
            </span>
          </button>
        </form>

        <div class="link-container">
          Já possui conta? <a href="/login">Faça Login</a>
        </div>

      </div>
    </div>
  </div>
  <script src="/js/apiClient.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
