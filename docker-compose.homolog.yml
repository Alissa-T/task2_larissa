version: '3.8'

services:
  homolog-db:
    image: postgres:16-alpine
    container_name: homolog-db
    environment:
      POSTGRES_DB: financeiro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - homolog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financeiro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  homolog-flyway:
    image: flyway/flyway:10.0.0
    container_name: homolog-flyway
    command: -url=jdbc:postgresql://homolog-db:5432/financeiro_db -user=postgres -password=postgres -connectRetries=60 migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      homolog-db:
        condition: service_healthy

  homolog-app:
    build: .
    container_name: homolog-app
    ports:
      - "3001:3000"
    environment:
      DB_HOST: homolog-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: financeiro_db
      PORT: 3000
      SESSION_SECRET: homolog_secret_key_8832
    depends_on:
      homolog-flyway:
        condition: service_completed_successfully

volumes:
  homolog-db-data:
