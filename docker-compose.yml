version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dev-db
    environment:
      POSTGRES_DB: financeiro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financeiro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10.0.0
    container_name: dev-flyway
    command: -url=jdbc:postgresql://db:5432/financeiro_db -user=postgres -password=postgres -connectRetries=60 migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: dev-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: financeiro_db
      PORT: 3000
      SESSION_SECRET: dev_secret_key_9876
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  dev-db-data:
